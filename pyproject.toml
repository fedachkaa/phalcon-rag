[project]
name = "phalcon-rag"
description = "RAG assistant for Phalcon documentation"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "transformers>=5.0,<6.0",
    "sentence-transformers>=6.0,<7.0",
    "numpy>=2.0,<2.4",
    "bm25s>=0.2,<1.0",
    "openai>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.13,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"